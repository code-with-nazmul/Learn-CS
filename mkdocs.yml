site_name: Learn CS

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# extra:
#   generator: false

  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js



nav : 
  - Home : index.md
  - Algorithms: 
    - Algorithms Overview : Algorithms/algorithms-main-page.md
    - Binary Search: Algorithms/binary-search.md
  - Data Structure:
    - Data structure Overview: Data-Structure/ds-main-page.md
  - Database:
    - Database Overview: Database/database-main-page.md
  - OOP:
    - OOP Overview: oop/oop-main-page.md
    - OOP Fundamentals: oop/oop-fundamentals.md
    - Four pillars of OOP : oop/four-pillars-oop.md
    - More about four pillars: oop/more-about-four-pillars.md
  - Networking:
    - Networking Overview: Networking/networking-main-page.md
  - Operating System:
    - Operating System Overview: OS/os-main-page.md
